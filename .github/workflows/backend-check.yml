name: Backend check

# Menjalankan uji lokal backend (PostgreSQL) + pemeriksaan statis Edge Function
# pada setiap perubahan. Tidak memerlukan Supabase/Docker: PostgreSQL 16 asli
# dijalankan di dalam job lewat paket Python `pgserver`.
#
# Cakupan:
#   * 11 migrasi supabase/migrations/*.sql
#   * 17 kelompok uji perilaku (tools/db_smoke_test.sql)
#   * kecocokan nama + parameter RPC dengan tanda tangan fungsi di database
#   * impor relatif & nama ekspor Edge Function (tools/ts_check.js)
#   * sintaks seluruh berkas TypeScript (esbuild)
#   * 18 skenario end-to-end: Edge Function dijalankan sungguhan (tools/e2e)
#   * berkas siap-tempel Dashboard (supabase/deploy-dashboard) tidak basi,
#     dan bundelnya menjalani 18 skenario yang sama
#   * firestore.rules diuji di Firestore Emulator (13 pengujian keamanan):
#     pesanan terikat pemiliknya, tidak bisa dititipkan/dialihkan, dan
#     rateLimits hanya untuk server

on:
  push:
    paths:
      - "supabase/**"
      - "tools/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tools/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # Node 22 diperlukan: menjalankan berkas .ts langsung (type stripping).
          node-version: "22"

      - name: Pasang pgserver (PostgreSQL 16 lokal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pgserver "psycopg[binary]"

      - name: Migrasi + uji perilaku + kecocokan RPC
        run: python tools/db_check.py --dir /tmp/dbcheck

      - name: Impor & nama ekspor Edge Function
        run: node tools/ts_check.js

      - name: End-to-end Edge Function (PostgreSQL tiruan Supabase)
        run: node tools/e2e/run_e2e.mts

      - name: Sintaks TypeScript (esbuild)
        run: |
          npm install --no-save esbuild@0.28.2
          for f in $(find supabase/functions -name '*.ts'); do
            ./node_modules/.bin/esbuild "$f" --outfile=/dev/null --log-level=error
          done

      - name: Berkas siap-tempel Dashboard tidak basi
        run: |
          node tools/bundle_functions.js
          git diff --exit-code supabase/deploy-dashboard \
            || { echo "Bundel usang — jalankan: node tools/bundle_functions.js"; exit 1; }

      - name: End-to-end berkas siap-tempel Dashboard
        run: E2E_FUNCTIONS_DIR=supabase/deploy-dashboard node tools/e2e/run_e2e.mts

  firestore-rules:
    name: Aturan Firestore (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Emulator Firestore berjalan di JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pasang firebase-tools + SDK uji aturan
        run: npm install --no-save firebase-tools@15 firebase@12 @firebase/rules-unit-testing@5

      # Kalau job ini merah, JANGAN publish firestore.rules ke Firebase Console.
      - name: Uji firestore.rules (13 pengujian keamanan)
        id: rules
        continue-on-error: true
        env:
          CI: "true"
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-raratravel \
            "node tools/firestore/rules_test.mjs" 2>&1 | tee rules-emulator.log

      # Anotasi + ringkasan supaya sebab kegagalan terlihat tanpa membuka log
      # mentah (`gh run view` menampilkannya).
      - name: Laporkan hasil uji aturan
        if: always()
        run: |
          {
            echo "### Aturan Firestore (emulator)"
            echo ""
            echo "Status: **${{ steps.rules.outcome }}**"
            echo ""
            echo '```'
            if [ -f rules-result.txt ]; then
              cat rules-result.txt
            else
              tail -n 40 rules-emulator.log 2>/dev/null || echo "(log belum ada)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Utamakan ringkasan bersih dari skrip uji (berisi SEBAB + JEJAK).
          LAPOR=rules-result.txt
          [ -f "$LAPOR" ] || LAPOR=rules-emulator.log
          if [ -f "$LAPOR" ]; then
            grep -aE "GAGAL|SEBAB|JEJAK|❌|Error" "$LAPOR" | head -n 30 | \
              while IFS= read -r baris; do
                echo "::error::$(printf '%s' "$baris" | cut -c1-400)"
              done
          fi
          if [ "${{ steps.rules.outcome }}" != "success" ]; then
            echo "::error title=Aturan Firestore::Uji emulator gagal — JANGAN publish firestore.rules."
            exit 1
          fi

      - name: Simpan log uji aturan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-log
          path: rules-emulator.log
          if-no-files-found: warn
