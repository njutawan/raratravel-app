name: raratravel_app
description: Aplikasi booking travel Rara Travel & Tour (raratravel.id) - Travel antar kota door-to-door, sewa mobil, paket wisata, kirim paket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.0
  firebase_app_check: ^0.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  supabase_flutter: ^2.8.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
