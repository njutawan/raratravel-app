name: raratravel_app
description: Aplikasi booking travel Rara Travel & Tour (raratravel.id) - Travel antar kota door-to-door, sewa mobil, paket wisata, kirim paket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Terjemahan bawaan Flutter (nama hari/bulan + dialog tanggal, dll.)
  flutter_localizations:
    sdk: flutter
  # Pilih foto bukti transfer dari galeri/kamera.
  image_picker: ^1.1.2
  # Firebase (FlutterFire) generasi firebase_core 4.x — dipakai SEMUA paket di
  # bawah ini; jangan naikkan salah satu sendirian, karena tiap paket mematok
  # firebase_core ^4.14.0. Mode aplikasi tetap sama (Supabase jadi backend
  # utama; Firebase untuk login OTP, notifikasi, App Check, Crashlytics).
  firebase_auth: ^6.7.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.8
  # google_sign_in 7.x = API baru (singleton + initialize/authenticate).
  # Butuh OAuth client *web* di google-services.json → sudah terpenuhi.
  google_sign_in: ^7.2.0
  # Pelaporan crash otomatis (dipakai hanya di build rilis — lihat
  # lib/services/firebase_bootstrap.dart).
  firebase_crashlytics: ^5.4.0
  # Versi intl dikunci oleh flutter_localizations (SDK Flutter), jadi harus
  # mengikuti pin SDK — jangan diturunkan/dinaikkan sendiri.
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  supabase_flutter: ^2.8.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
